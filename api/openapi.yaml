# Passo 5 — Especificação OpenAPI da aplicação Do Campo à Mesa.
# Documentação dos endpoints REST, schemas, respostas e autenticação JWT.
openapi: 3.0.3
info:
  title: Do Campo à Mesa API
  version: 0.1.0
  description: API REST do mercado digital de produtores locais.
security: []
servers:
  - url: http://localhost:3000/api
paths:
  /auth/login:
    post:
      operationId: criarAuthLogin
      tags: [Autenticação]
      summary: Iniciar sessão
      description: Valida as credenciais e devolve um token JWT e os dados públicos do utilizador.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Email ou password em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/registo:
    post:
      operationId: criarAuthRegisto
      tags: [Autenticação]
      summary: Registar utilizador
      description: >
        Cria uma conta de comprador ou produtor. A password é
        guardada com bcrypt (custo 12). Os produtores ficam
        pendentes de aprovação administrativa.
        O registo público de administradores não é permitido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistoInput'
      responses:
        '201':
          description: Utilizador registado com sucesso
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    description: ObjectId do utilizador criado
        '400':
          description: Dados de registo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Email já registado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/eu:
    get:
      operationId: listarAuthEu
      tags: [Autenticação]
      summary: Consultar utilizador autenticado
      description: >
        Consulta os dados atuais do utilizador no MongoDB,
        utilizando um JWT válido no cabeçalho Authorization.
        A password e o respetivo hash não são devolvidos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do utilizador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '401':
          description: Token inválido, expirado ou utilizador inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /products:
    get:
      operationId: listarProducts
      tags: [Produtos]
      summary: Pesquisar e listar produtos
      description: >
        Pesquisa produtos visíveis por nome, ingrediente ou produtor,
        com filtros por categoria, localidade, preço, época e
        produção biológica, além de ordenação.
      parameters:
        - name: q
          in: query
          description: Pesquisa textual por nome, ingrediente ou produtor
          schema: { type: string }
        - name: categoria
          in: query
          schema: { type: string }
        - name: precoMax
          in: query
          description: Preço máximo, incluindo o valor indicado
          schema: { type: number, minimum: 0 }
        - name: bio
          in: query
          description: Utilizar true para apresentar apenas produtos biológicos
          schema: { type: boolean }
        - name: epoca
          in: query
          schema:
            type: string
            enum: [Primavera, Verão, Outono, Inverno]
        - name: produtor
          in: query
          description: ObjectId do produtor
          schema: { type: string }
        - name: ordenar
          in: query
          schema:
            type: string
            enum: [recentes, preco_asc, preco_desc]
            default: recentes
        - name: localidade
          in: query
          description: Localidade do produtor
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      operationId: criarProducts
      tags: [Produtos]
      summary: Criar produto
      description: Apenas produtores validados pelo administrador.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto criado
          headers:
            Location:
              description: Caminho do produto criado
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { description: Dados inválidos }
        '401': { description: Autenticação necessária }
        '403': { description: Produtor sem permissão ou não validado }


  /products/mine:
    get:
      operationId: listarMeusProdutos
      tags: [Produtos]
      summary: Consultar os meus produtos
      description: >
        Devolve todos os produtos do produtor autenticado,
        incluindo os ocultados pela administração.
        O produtor apenas consulta os seus próprios produtos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de produtos do produtor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas produtores podem consultar esta lista


  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ObjectId do produto
        schema: { type: string }

    get:
      operationId: listarProductsId
      tags: [Produtos]
      summary: Consultar produto
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { description: Identificador inválido }
        '404': { description: Produto não encontrado }

    put:
      operationId: atualizarProductsId
      tags: [Produtos]
      summary: Atualizar produto
      description: Apenas o produtor proprietário pode atualizar os campos permitidos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { description: Dados inválidos }
        '401': { description: Autenticação necessária }
        '403': { description: Apenas produtores podem atualizar produtos }
        '404': { description: Produto não encontrado }

    delete:
      operationId: eliminarProductsId
      tags: [Produtos]
      summary: Eliminar produto
      description: Apenas o produtor proprietário pode eliminar o produto.
      security:
        - bearerAuth: []
      responses:
        '204': { description: 'Produto eliminado, sem corpo na resposta' }
        '400': { description: Identificador inválido }
        '401': { description: Autenticação necessária }
        '403': { description: Apenas produtores podem eliminar produtos }
        '404': { description: Produto não encontrado }

  /producers:
    get:
      operationId: listarProducers
      tags: [Produtores]
      summary: Listar produtores validados
      description: Lista pública dos produtores aprovados pelo administrador, ordenados por nome.
      parameters:
        - name: localidade
          in: query
          description: Filtrar por localidade, sem distinguir maiúsculas e minúsculas
          schema:
            type: string
            example: Barcelos
      responses:
        '200':
          description: Lista de produtores validados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProducerPublic'


  /producers/me:
    get:
      operationId: consultarMeuPerfilProdutor
      tags: [Produtores]
      summary: Consultar o perfil da própria exploração
      description: >
        Permite ao produtor autenticado consultar os seus dados
        e as informações da sua exploração.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do produtor autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPrivate'
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas produtores podem consultar o perfil
        '404':
          description: Produtor não encontrado

    patch:
      operationId: atualizarMeuPerfilProdutor
      tags: [Produtores]
      summary: Atualizar o perfil da exploração
      description: >
        Permite alterar o nome, descrição, localidade e
        coordenadas da própria exploração.
        Não permite alterar o estado de validação.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProducerUpdateInput'
      responses:
        '200':
          description: Perfil atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerPrivate'
        '400':
          description: Dados de atualização inválidos
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas produtores podem editar o perfil
        '404':
          description: Produtor não encontrado


  /producers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ObjectId do produtor
        schema:
          type: string
    get:
      operationId: listarProducersId
      tags: [Produtores]
      summary: Consultar perfil público de um produtor
      description: Devolve os dados do produtor validado, os produtos e a média das avaliações visíveis.
      responses:
        '200':
          description: Perfil público do produtor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerDetail'
        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Produtor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auctions:
    get:
      operationId: listarAuctions
      tags: [Leilões]
      summary: Listar leilões
      parameters:
        - name: estado
          in: query
          description: Filtrar pelo estado do leilão
          schema:
            type: string
            enum: [agendado, ativo, terminado]
      responses:
        '200':
          description: Lista de leilões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auction'
        '400':
          description: Estado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      operationId: criarAuctions
      tags: [Leilões]
      summary: Criar leilão
      description: Apenas produtores validados podem criar leilões.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuctionInput'
      responses:
        '201':
          description: Leilão criado
          headers:
            Location:
              description: Caminho do leilão criado
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auction'
        '400': { description: Dados ou identificador de produto inválidos }
        '401': { description: Autenticação necessária }
        '403': { description: Utilizador não é um produtor validado }
        '404': { description: Produto associado não encontrado, oculto ou não pertencente ao produtor }

  /auctions/mine:
    get:
      operationId: listarMeusLeiloes
      tags: [Leilões]
      summary: Consultar os meus leilões
      description: >
        Lista os leilões pertencentes ao produtor autenticado,
        incluindo estados, licitação atual, vencedor e
        encomenda associada, quando existirem.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de leilões do produtor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auction'
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas produtores podem consultar esta lista


  /auctions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ObjectId do leilão
        schema: { type: string }

    get:
      operationId: listarAuctionsId
      tags: [Leilões]
      summary: Consultar detalhe de leilão
      description: Inclui as 10 licitações mais recentes, ordenadas por data.
      responses:
        '200':
          description: Leilão e últimas licitações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionDetail'
        '400': { description: Identificador inválido }
        '404': { description: Leilão não encontrado }

  /auctions/{id}/bids:
    parameters:
      - name: id
        in: path
        required: true
        description: ObjectId do leilão
        schema: { type: string }

    get:
      operationId: listarAuctionsIdBids
      tags: [Leilões]
      summary: Consultar histórico de licitações
      description: Devolve todas as licitações do leilão, das mais recentes para as mais antigas.
      responses:
        '200':
          description: Lista de licitações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bid'
        '400': { description: Identificador inválido }
        '404': { description: Leilão não encontrado }

  /reviews:
    get:
      operationId: listarReviews
      tags: [Avaliações]
      summary: Listar avaliações públicas
      description: Devolve apenas avaliações visíveis, ordenadas das mais recentes para as mais antigas.
      parameters:
        - name: produtor
          in: query
          description: ObjectId do produtor
          schema: { type: string }
        - name: produto
          in: query
          description: ObjectId do produto
          schema: { type: string }
      responses:
        '200':
          description: Lista de avaliações visíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '400':
          description: Identificador de produtor ou produto inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      operationId: criarReviews
      tags: [Avaliações]
      summary: Criar avaliação
      description: Apenas compradores podem avaliar uma encomenda própria já entregue. É permitida uma avaliação por encomenda.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Avaliação criada
          headers:
            Location:
              description: Caminho da avaliação criada
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Dados inválidos ou produto não pertencente à encomenda
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas compradores podem criar avaliações
        '404':
          description: Encomenda não encontrada ou não pertence ao comprador
        '409':
          description: Encomenda ainda não entregue ou já avaliada

  /reviews/{id}/denuncia:
    parameters:
      - name: id
        in: path
        required: true
        description: ObjectId da avaliação
        schema: { type: string }

    post:
      operationId: criarReviewsIdDenuncia
      tags: [Avaliações]
      summary: Denunciar avaliação
      description: Incrementa o número de denúncias de uma avaliação existente.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Denúncia registada, sem corpo na resposta
        '400':
          description: Identificador inválido
        '401':
          description: Autenticação necessária
        '404':
          description: Avaliação não encontrada


  /admin/products:
    get:
      operationId: listarProdutosAdministracao
      tags: [Administração]
      summary: Listar produtos para moderação
      description: >
        Lista todos os produtos da plataforma,
        incluindo os ocultados pela administração.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista completa de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas administradores

  /admin/products/{id}/visibilidade:
    parameters:
      - name: id
        in: path
        required: true
        description: ObjectId do produto
        schema:
          type: string

    patch:
      operationId: alterarVisibilidadeProduto
      tags: [Administração]
      summary: Ocultar ou restaurar um produto
      description: >
        Permite ao administrador alterar a visibilidade
        de um produto sem o eliminar da base de dados.
        Produtos ocultos deixam de aparecer no catálogo
        público e não podem ser comprados nem associados
        a novos leilões.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductModerationInput'
      responses:
        '200':
          description: Visibilidade atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Identificador ou visibilidade inválidos
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas administradores
        '404':
          description: Produto não encontrado


  /admin/estatisticas:
    get:
      operationId: listarAdminEstatisticas
      tags: [Administração]
      summary: Consultar estatísticas da plataforma
      description: Apenas administradores; encomendas de hoje calculadas em UTC.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Estatísticas gerais
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatistics' }
        '401': { description: Autenticação necessária }
        '403': { description: Apenas administradores }

  /admin/produtores/pendentes:
    get:
      operationId: listarAdminProdutoresPendentes
      tags: [Administração]
      summary: Listar produtores por validar
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Produtores pendentes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProducerPublic' }
        '401': { description: Autenticação necessária }
        '403': { description: Apenas administradores }

  /admin/produtores/{id}/validacao:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: alterarAdminProdutoresIdValidacao
      tags: [Administração]
      summary: Aprovar ou retirar a validação de um produtor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProducerValidationInput' }
      responses:
        '200':
          description: Produtor atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProducerPublic' }
        '400': { description: Identificador ou campo aprovado inválido }
        '401': { description: Autenticação necessária }
        '403': { description: Apenas administradores }
        '404': { description: Produtor não encontrado }

  /admin/reviews/denunciadas:
    get:
      operationId: listarAdminReviewsDenunciadas
      tags: [Administração]
      summary: Listar avaliações denunciadas
      description: Avaliações com pelo menos uma denúncia.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Avaliações denunciadas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '401': { description: Autenticação necessária }
        '403': { description: Apenas administradores }

  /admin/reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: alterarAdminReviewsId
      tags: [Administração]
      summary: Alterar visibilidade de uma avaliação
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewModerationInput' }
      responses:
        '200':
          description: Avaliação atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { description: Identificador ou campo visivel inválido }
        '401': { description: Autenticação necessária }
        '403': { description: Apenas administradores }
        '404': { description: Avaliação não encontrada }

  /orders:
    get:
      operationId: listarOrders
      tags: [Encomendas]
      summary: Listar as encomendas do utilizador autenticado
      description: Compradores consultam as suas compras; produtores consultam as encomendas recebidas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de encomendas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '403':
          description: Utilizador sem permissão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      operationId: criarOrders
      tags: [Encomendas]
      summary: Criar encomendas a partir do carrinho
      description: Cria uma encomenda por produtor, reservando o stock numa transação MongoDB.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Encomendas criadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas compradores podem criar encomendas
        '404':
          description: Produto não encontrado
        '409':
          description: Stock insuficiente ou produto indisponível para compra

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador da encomenda
        schema:
          type: string
    get:
      operationId: listarOrdersId
      tags: [Encomendas]
      summary: Consultar uma encomenda
      description: Apenas o comprador ou produtor associado pode consultar a encomenda.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Encomenda encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Identificador inválido
        '401':
          description: Autenticação necessária
        '403':
          description: Utilizador sem permissão
        '404':
          description: Encomenda não encontrada

  /orders/{id}/estado:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador da encomenda
        schema:
          type: string
    patch:
      operationId: alterarOrdersIdEstado
      tags: [Encomendas]
      summary: Atualizar o estado de uma encomenda
      description: Apenas o produtor associado pode avançar a encomenda para o estado seguinte.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStateInput'
      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Estado ou identificador inválido
        '401':
          description: Autenticação necessária
        '403':
          description: Apenas produtores podem atualizar o estado
        '404':
          description: Encomenda não encontrada
        '409':
          description: Transição de estado não permitida

  /products/{id}/imagem:
    parameters:
      - name: id
        in: path
        required: true
        description: ObjectId do produto
        schema: { type: string }
    post:
      operationId: criarProductsIdImagem
      tags: [Produtos]
      summary: Enviar imagem de um produto
      description: "Previsto para o Passo 8. Atualmente devolve HTTP 501 após autenticação e processamento do upload."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem:
                  type: string
                  format: binary
                  description: Imagem com limite de 5 MB
      responses:
        '401': { description: Autenticação necessária }
        '403': { description: Apenas produtores podem enviar imagens }
        '501':
          description: Upload ainda não implementado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /health:
    get:
      operationId: listarHealth
      tags: [Sistema]
      summary: Verificar o estado da API
      description: Endpoint público de verificação do funcionamento da API.
      responses:
        '200':
          description: API operacional
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado:
                    type: string
                    enum: [ok]
              example:
                estado: ok

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:

    ProducerPrivate:
      type: object
      properties:
        _id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        produtor:
          type: object
          properties:
            nomeExploracao:
              type: string
            descricao:
              type: string
            localidade:
              type: string
            validado:
              type: boolean
            localizacao:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number

    ProducerUpdateInput:
      type: object
      description: >
        Campos editáveis da exploração.
        O estado de validação não pode ser alterado.
      properties:
        nomeExploracao:
          type: string
          minLength: 1
          maxLength: 150
          example: Mel do Soajo
        descricao:
          type: string
          maxLength: 1000
          example: Produção artesanal de mel da Serra do Soajo.
        localidade:
          type: string
          minLength: 1
          maxLength: 150
          example: Arcos de Valdevez
        localizacao:
          type: object
          required: [lat, lng]
          additionalProperties: false
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
              example: 41.874
            lng:
              type: number
              minimum: -180
              maximum: 180
              example: -8.264

    ProductModerationInput:
      type: object
      required: [visivel]
      properties:
        visivel:
          type: boolean
          description: >
            true para apresentar o produto no catálogo;
            false para o ocultar.
          example: false

    ProductInput:
      type: object
      required: [nome, categoria, preco]
      properties:
        nome: { type: string, example: Kiwi Hayward }
        descricao: { type: string, example: Kiwi fresco da produção local }
        ingredientes:
          type: array
          items: { type: string }
          example: [Kiwi]
        categoria: { type: string, enum: [Hortícolas, Fruta, Mel, Vinho, Queijo, Padaria, Outros] }
        preco: { type: number, example: 2.4 }
        unidade: { type: string, example: kg }
        stock: { type: integer, example: 300 }
        biologico: { type: boolean }
        epocas: { type: array, items: { type: string } }
    ProductUpdateInput:
      type: object
      description: Campos opcionais permitidos na atualização de um produto
      properties:
        nome: { type: string }
        descricao: { type: string }
        ingredientes:
          type: array
          items: { type: string }
        categoria:
          type: string
          enum: [Hortícolas, Fruta, Mel, Vinho, Queijo, Padaria, Outros]
        preco: { type: number, minimum: 0 }
        unidade: { type: string }
        stock: { type: number, minimum: 0 }
        biologico: { type: boolean }
        epocas:
          type: array
          items:
            type: string
            enum: [Primavera, Verão, Outono, Inverno]


    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            _id:
              type: string
            produtor:
              description: ObjectId ou dados públicos do produtor
              oneOf:
                - type: string
                - $ref: '#/components/schemas/ProducerPublic'
            imagemUrl:
              type: string
            visivel:
              type: boolean
              default: true
              description: >
                Indica se o produto está visível no catálogo.
                Apenas o administrador pode alterar este campo.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    RegistoInput:
      type: object
      required: [nome, email, password]
      properties:
        nome:
          type: string
          minLength: 1
          example: Maria Silva
        email:
          type: string
          format: email
          example: maria@example.com
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        papel:
          type: string
          enum: [comprador, produtor]
          default: comprador
        produtor:
          type: object
          description: Obrigatório quando o papel é produtor
          required: [nomeExploracao, localidade]
          properties:
            nomeExploracao:
              type: string
              minLength: 1
              example: Quinta da Maria
            localidade:
              type: string
              minLength: 1
              example: Barcelos

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: comprador@example.com
        password:
          type: string
          format: password
          writeOnly: true

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT
        utilizador:
          $ref: '#/components/schemas/UserPublic'

    ProducerPublic:
      type: object
      description: Dados públicos de um produtor validado
      properties:
        _id:
          type: string
          description: ObjectId do utilizador produtor
        nome:
          type: string
        email:
          type: string
          format: email
          description: Presente na listagem pública de produtores
        produtor:
          type: object
          properties:
            nomeExploracao:
              type: string
            descricao:
              type: string
            localidade:
              type: string
            localizacao:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }

    ProducerDetailUser:
      type: object
      description: Dados devolvidos no perfil individual, sem email
      properties:
        _id: { type: string }
        nome: { type: string }
        produtor:
          type: object
          properties:
            nomeExploracao: { type: string }
            descricao: { type: string }
            localidade: { type: string }
            localizacao:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }

    ProducerDetail:
      type: object
      required: [produtor, produtos, avaliacaoMedia]
      properties:
        produtor:
          $ref: '#/components/schemas/ProducerDetailUser'
        produtos:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        avaliacaoMedia:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
          description: Média das avaliações visíveis, ou null quando não existem avaliações
          example: 4.5

    UserPublic:
      type: object
      properties:
        _id: { type: string }
        nome: { type: string }
        email: { type: string, format: email }
        papel:
          type: string
          enum: [comprador, produtor, admin]
        produtor:
          type: object
          properties:
            nomeExploracao: { type: string }
            descricao: { type: string }
            localidade: { type: string }
            validado: { type: boolean }

    AuctionInput:
      type: object
      required: [lote, quantidade, precoBase, incremento, iniciaEm, duracaoMinutos]
      properties:
        produto:
          type: string
          description: ObjectId opcional de um produto pertencente ao produtor
        lote:
          type: string
          example: 200 kg de kiwi Hayward
        quantidade:
          type: string
          example: 200 kg
        precoBase:
          type: number
          minimum: 0
          example: 100
        incremento:
          type: number
          minimum: 0.01
          example: 5
        iniciaEm:
          type: string
          format: date-time
          description: Data futura de início do leilão
        duracaoMinutos:
          type: integer
          minimum: 1
          example: 60

    Auction:
      type: object
      properties:
        _id: { type: string }
        produtor:
          description: ObjectId ou dados públicos do produtor
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/ProducerPublic' }
        produto:
          description: ObjectId ou dados do produto associado
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/Product' }
        lote: { type: string }
        quantidade: { type: string }
        precoBase: { type: number }
        incremento: { type: number }
        licitacaoAtual:
          type: object
          properties:
            valor: { type: number }
            comprador: { type: string }
        iniciaEm: { type: string, format: date-time }
        terminaEm: { type: string, format: date-time }
        estado:
          type: string
          enum: [agendado, ativo, terminado]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Bid:
      type: object
      properties:
        _id: { type: string }
        leilao: { type: string }
        comprador:
          description: ObjectId ou comprador com nome
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/UserPublic' }
        valor: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AuctionDetail:
      type: object
      required: [leilao, licitacoes]
      properties:
        leilao:
          $ref: '#/components/schemas/Auction'
        licitacoes:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Bid'

    ReviewInput:
      type: object
      required: [encomenda, classificacao]
      properties:
        encomenda:
          type: string
          description: ObjectId de uma encomenda própria já entregue
        produto:
          type: string
          description: ObjectId opcional de um produto da encomenda
        classificacao:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          example: Produtos frescos e de excelente qualidade

    Review:
      type: object
      properties:
        _id:
          type: string
        autor:
          description: ObjectId ou utilizador com nome
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/UserPublic' }
        produtor:
          description: ObjectId ou produtor com dados públicos
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/ProducerPublic' }
        produto:
          description: ObjectId ou produto com nome
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/Product' }
        encomenda:
          type: string
        classificacao:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
        denuncias:
          type: integer
          minimum: 0
        visivel:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminStatistics:
      type: object
      required: [utilizadores, produtores, encomendasHoje, leiloesAtivos]
      properties:
        utilizadores: { type: integer, minimum: 0 }
        produtores: { type: integer, minimum: 0 }
        encomendasHoje: { type: integer, minimum: 0 }
        leiloesAtivos: { type: integer, minimum: 0 }

    ProducerValidationInput:
      type: object
      required: [aprovado]
      properties:
        aprovado: { type: boolean, example: true }

    ReviewModerationInput:
      type: object
      required: [visivel]
      properties:
        visivel: { type: boolean, example: false }

    OrderItemInput:
      type: object
      required: [produto, quantidade]
      properties:
        produto: { type: string, description: ObjectId do produto }
        quantidade: { type: integer, minimum: 1 }

    OrderDelivery:
      type: object
      properties:
        tipo:
          type: string
          enum: [levantamento, entrega]
          default: levantamento
        morada:
          type: string
          description: Obrigatória quando o tipo é entrega

    OrderInput:
      type: object
      required: [linhas]
      properties:
        linhas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
        entrega:
          $ref: '#/components/schemas/OrderDelivery'

    OrderLine:
      type: object
      properties:
        produto: { type: string }
        nome: { type: string }
        precoUnit: { type: number, minimum: 0 }
        quantidade: { type: integer, minimum: 1 }

    Order:
      type: object
      properties:
        _id: { type: string }
        comprador:
          description: ObjectId ou utilizador com dados populados
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/UserPublic' }
        produtor:
          description: ObjectId ou utilizador com dados populados
          oneOf:
            - { type: string }
            - { $ref: '#/components/schemas/UserPublic' }
        linhas:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        estado:
          type: string
          enum: [pendente, confirmada, pronta, entregue]
        entrega:
          $ref: '#/components/schemas/OrderDelivery'
        total:
          type: number
          readOnly: true
          description: Total calculado automaticamente a partir das linhas
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderStateInput:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [pendente, confirmada, pronta, entregue]

    Erro:
      type: object
      required: [erro]
      properties:
        erro: { type: string }
        detalhes:
          type: array
          items: { type: string }
